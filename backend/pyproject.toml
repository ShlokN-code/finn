[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finn"
version = "0.1.0"
description = "FINN — portfolio editor for Indian equities"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary]>=3.2",
]
jobs = [
  "requests>=2.32",
  "yfinance>=1.8",
  "lxml>=5.0",
  "beautifulsoup4>=4.12",
  "pandas>=2.2",
]
dev = [
  "pytest>=8",
  "ruff>=0.7",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["finn*", "api*", "jobs*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
