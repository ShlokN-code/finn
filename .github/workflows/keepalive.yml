# Keeps the free tiers awake: Render sleeps after ~15 min idle; Supabase pauses after 7 days idle.
# Primary: cron-job.org pings /health/db every 10 min (docs/DEPLOY.md §6). This GitHub cron is the backup —
# it fires far less often than scheduled.
# Set repository variable API_BASE_URL (Settings → Secrets and variables → Actions → Variables).
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"   # UTC; GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping API and DB
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then echo "::notice::API_BASE_URL variable not set; skipping"; exit 0; fi
          curl -fsS --max-time 90 --retry 2 "$API_BASE_URL/health"; echo
          curl -fsS --max-time 60 "$API_BASE_URL/health/db"; echo
