# Scheduled ingestion. NSE blocks Render, so all NSE data is fetched here (DECISIONS.md) and written to Supabase.
# Cron times are UTC (IST = UTC+5:30). GitHub may start scheduled runs several minutes late.
name: ingest

on:
  schedule:
    - cron: "0 11 * * 1-5"      # 16:30 IST — daily post-close ingest
    - cron: "*/30 3-16 * * 1-5"  # every 30 min, 08:30–22:00 IST — filing checks (script gates the window)
  workflow_dispatch:
    inputs:
      job:
        description: "daily | filings | results | snapshot | migrate"
        required: true
        default: daily
        type: choice
        options: [daily, filings, results, snapshot, migrate]
      symbols:
        description: "Comma-separated NSE symbols (default: demo portfolio)"
        required: false
        default: ""
      backfill_days:
        description: "daily: days of filings to (re)fetch (365 also backfills 1y prices); results: event age in days"
        required: false
        default: "0"
      date:
        description: "snapshot: trading day YYYY-MM-DD (blank = suggest the richest recent day)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODEL_CHEAP: ${{ vars.GEMINI_MODEL_CHEAP }}
      GEMINI_MODEL_STRONG: ${{ vars.GEMINI_MODEL_STRONG }}
      FINN_CACHE_DIR: ${{ github.workspace }}/backend/.cache
      PYTHONUNBUFFERED: "1"
      # Dispatch inputs go through env, never interpolated into shell (script-injection safe).
      IN_SYMBOLS: ${{ inputs.symbols }}
      IN_BACKFILL: ${{ inputs.backfill_days || '0' }}
      IN_DATE: ${{ inputs.date }}
      IN_JOB: ${{ inputs.job }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[jobs]"
      # Raw download cache (PDFs, archive files) survives between runs — polite to NSE (rule 6).
      - uses: actions/cache@v4
        with:
          path: backend/.cache
          key: raw-cache-${{ github.run_id }}
          restore-keys: raw-cache-
      - name: pick job
        id: pick
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then job="$IN_JOB";
          elif [ "$SCHEDULE" = "0 11 * * 1-5" ]; then job=daily;
          else job=filings; fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "::notice title=ingest::job=$job"
      - name: migrate
        if: steps.pick.outputs.job == 'migrate' || steps.pick.outputs.job == 'daily'
        run: python -m jobs.migrate
      - name: daily ingest
        if: steps.pick.outputs.job == 'daily'
        run: python -m jobs.ingest_daily --symbols "$IN_SYMBOLS" --backfill-days "$IN_BACKFILL"
      - name: filing check
        if: steps.pick.outputs.job == 'filings'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then force=--force; else force=; fi
          python -m jobs.check_filings --symbols "$IN_SYMBOLS" $force
      - name: results cards
        if: steps.pick.outputs.job == 'results'
        run: |
          days="$IN_BACKFILL"; if [ "$days" = "0" ]; then days=45; fi
          python -m jobs.results --symbols "$IN_SYMBOLS" --days "$days"
      - name: snapshot
        if: steps.pick.outputs.job == 'snapshot'
        run: python -m jobs.snapshot --date "$IN_DATE" --symbols "$IN_SYMBOLS"
      - name: upload snapshot file
        if: steps.pick.outputs.job == 'snapshot'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: backend/data/snapshots/
