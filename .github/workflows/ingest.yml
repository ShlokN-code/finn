# Scheduled ingestion. NSE blocks Render, so all NSE data is fetched here (DECISIONS.md) and written to Supabase.
# Primary trigger: cron-job.org calls workflow_dispatch with scheduled=true (docs/DEPLOY.md §6) — GitHub's cron
# fires too rarely to rely on. The cron entries below stay as a backup; a slot that already ran is skipped
# (backend/finn/ingest/schedule.py). Cron times are UTC (IST = UTC+5:30).
name: ingest

on:
  schedule:
    - cron: "0 11 * * 1-5"      # 16:30 IST — daily post-close ingest
    - cron: "*/30 3-16 * * 1-5"  # every 30 min, 08:30–22:00 IST — filing checks (script gates the window)
    - cron: "30 1 * * *"         # 07:00 IST daily — release alerts held during quiet hours
  workflow_dispatch:
    inputs:
      job:
        description: "daily | filings | results | alerts | snapshot | migrate | refresh (nightly research)"
        required: true
        default: daily
        type: choice
        options: [daily, filings, results, alerts, snapshot, migrate, refresh]
      symbols:
        description: "Comma-separated NSE symbols (default: demo portfolio)"
        required: false
        default: ""
      backfill_days:
        description: "daily: days of filings to (re)fetch (365 also backfills 1y prices); results / filings: event age in days to build or tag"
        required: false
        default: "0"
      date:
        description: "snapshot: trading day YYYY-MM-DD (blank = suggest the richest recent day)"
        required: false
        default: ""
      scheduled:
        description: "Set by the external scheduler: respect the filing window, skip a slot that already ran"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      job: ${{ steps.pick.outputs.job }}
      refresh: ${{ steps.pick.outputs.refresh }}
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODEL_CHEAP: ${{ vars.GEMINI_MODEL_CHEAP }}
      GEMINI_MODEL_STRONG: ${{ vars.GEMINI_MODEL_STRONG }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
      FINN_CACHE_DIR: ${{ github.workspace }}/backend/.cache
      PYTHONUNBUFFERED: "1"
      # Dispatch inputs go through env, never interpolated into shell (script-injection safe).
      IN_SYMBOLS: ${{ inputs.symbols }}
      IN_BACKFILL: ${{ inputs.backfill_days || '0' }}
      IN_DATE: ${{ inputs.date }}
      IN_JOB: ${{ inputs.job }}
      SCHEDULE: ${{ github.event.schedule }}
      # schedule (GitHub cron) and scheduler dispatches are cron slots; plain manual dispatches are not
      SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.scheduled) && 'true' || 'false' }}
      FINN_TRIGGER: ${{ inputs.scheduled && 'scheduler' || github.event_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[jobs]"
      # Raw download cache (PDFs, archive files) survives between runs — polite to NSE (rule 6).
      - uses: actions/cache@v4
        with:
          path: backend/.cache
          key: raw-cache-${{ github.run_id }}
          restore-keys: raw-cache-
      - name: pick job
        id: pick
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then job="$IN_JOB";
          elif [ "$SCHEDULE" = "0 11 * * 1-5" ]; then job=daily;
          elif [ "$SCHEDULE" = "30 1 * * *" ]; then job=alerts;
          else job=filings; fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "::notice title=ingest::job=$job"
          # Nightly research refresh rides on the first filing slot from 22:00 IST (no extra scheduler entry);
          # the refresh script itself dedupes to once per IST day.
          ist=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$job" = "refresh" ] || { [ "$job" = "filings" ] && [ "$SCHEDULED" = "true" ] && [ "$ist" -ge 2155 ]; }; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi
      - name: migrate
        if: steps.pick.outputs.job == 'migrate' || steps.pick.outputs.job == 'daily'
        run: python -m jobs.migrate
      - name: daily ingest
        if: steps.pick.outputs.job == 'daily'
        run: |
          if [ "$SCHEDULED" = "true" ]; then sched=--scheduled; else sched=; fi
          python -m jobs.ingest_daily --symbols "$IN_SYMBOLS" --backfill-days "$IN_BACKFILL" $sched
      - name: filing check
        if: steps.pick.outputs.job == 'filings'
        run: |
          # A manual dispatch runs now (forced past the IST window); a cron slot respects the window and dedupes.
          if [ "$SCHEDULED" = "true" ]; then flags=--scheduled; else flags=--force; fi
          days="$IN_BACKFILL"; if [ "$days" = "0" ]; then days=45; fi
          python -m jobs.check_filings --symbols "$IN_SYMBOLS" $flags --tag-days "$days"
      - name: results cards
        if: steps.pick.outputs.job == 'results'
        run: |
          days="$IN_BACKFILL"; if [ "$days" = "0" ]; then days=45; fi
          python -m jobs.results --symbols "$IN_SYMBOLS" --days "$days"
      - name: alerts
        if: steps.pick.outputs.job == 'alerts'
        run: python -m jobs.alerts
      - name: snapshot
        if: steps.pick.outputs.job == 'snapshot'
        run: python -m jobs.snapshot --date "$IN_DATE" --symbols "$IN_SYMBOLS"
      - name: upload snapshot file
        if: steps.pick.outputs.job == 'snapshot'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: backend/data/snapshots/

  # Nightly research refresh (DECISIONS: nightly refresh): portfolio + demo dossiers through the normal build queue.
  # Model calls only for new documents; an unchanged dossier reuses its summary (no strong call). Its own
  # concurrency group, so it never holds up the 30-min filing checks.
  research-refresh:
    needs: ingest
    if: ${{ always() && needs.ingest.outputs.refresh == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: research-refresh
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_MODEL_CHEAP: ${{ vars.GEMINI_MODEL_CHEAP }}
      GEMINI_MODEL_STRONG: ${{ vars.GEMINI_MODEL_STRONG }}
      GEMINI_MODEL_STRONG_FALLBACKS: ${{ vars.GEMINI_MODEL_STRONG_FALLBACKS }}
      FINN_CACHE_DIR: ${{ github.workspace }}/backend/.cache
      PYTHONUNBUFFERED: "1"
      FINN_TRIGGER: ${{ inputs.scheduled && 'scheduler' || github.event_name }}
      IN_JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[jobs]"
      - name: refresh
        run: |
          if [ "$IN_JOB" = "refresh" ]; then sched=; else sched=--scheduled; fi
          python -m jobs.research refresh $sched
