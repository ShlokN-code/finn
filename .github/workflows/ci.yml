name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[api,jobs,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: contracts schema is up to date
        run: |
          python -m finn.models.export_schema > /tmp/schema.json
          diff -u ../web/lib/schema.json /tmp/schema.json || (echo "::error::web/lib/schema.json is stale — run 'npm run gen:schema && npm run gen:types' in web/"; exit 1)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: generated types are up to date
        run: |
          npm run gen:types
          git diff --exit-code lib/types.ts || (echo "::error::web/lib/types.ts is stale — run 'npm run gen:types'"; exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
